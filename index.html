<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Slot Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <h1>📅 Smart Slot Booking</h1>
            <p>Book your preferred time slot with real-time conflict detection</p>
        </div>

        <div class="content-wrapper">
            <!-- Booking Form Section -->
            <div class="booking-section">
                <div class="form-card">
                    <h2>Reserve Your Slot</h2>
                    <form id="bookingForm">
                        <div class="form-group">
                            <label for="date">📍 Select Date</label>
                            <input type="date" id="date" required>
                            <small>Choose from today onwards</small>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="startTime">⏰ Start Time</label>
                                <input type="time" id="startTime" required>
                            </div>

                            <div class="form-group">
                                <label for="endTime">⏱️ End Time</label>
                                <input type="time" id="endTime" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="userName">👤 Your Name</label>
                            <input type="text" id="userName" placeholder="Enter your name" required>
                        </div>

                        <button type="submit" class="btn-submit">Book Slot</button>
                    </form>

                    <div id="message" class="message-box"></div>
                </div>
            </div>

            <!-- Booked Slots Section -->
            <div class="slots-section">
                <div class="slots-card">
                    <h2>📊 Booked Slots</h2>
                    <div id="slotsContainer" class="slots-container">
                        <p class="no-slots">No bookings yet. Be the first to book!</p>
                    </div>
                </div>

                <!-- Time Availability Chart -->
                <div class="availability-card">
                    <h2>⏳ Time Availability</h2>
                    <div id="timelineContainer" class="timeline-container">
                        <!-- Generated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
